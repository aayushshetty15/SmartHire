<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHire | Login</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- Header -->

    <header>

        <nav>

            <div class="logo">

                <a href="index.html">
                    SmartHire
                </a>

            </div>


            <ul>

                <li>
                    <a href="index.html#jobs">
                        Jobs
                    </a>
                </li>

                <li>
                    <a href="index.html#companies">
                        Companies
                    </a>
                </li>

                <li>
                    <a href="index.html#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contact
                    </a>
                </li>

            </ul>


            <div class="auth-buttons">

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Sign Up
                </a>

            </div>

        </nav>

    </header>


    <!-- Login -->

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your SmartHire account.
                </p>


                <form id="login-form">


                    <!-- Email -->

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Login -->

                    <button type="submit">
                        Login
                    </button>


                </form>


                <p id="login-message"></p>


                <p class="auth-link">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>


            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <div class="footer-content">

            <h2>
                SmartHire
            </h2>

            <p>
                Connecting talent with opportunity.
            </p>

            <p>
                &copy; 2026 SmartHire. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="../js/login.js"></script>

</body>

</html>
