<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHire | Register</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- Header -->

    <header>

        <nav>

            <div class="logo">

                <a href="index.html">
                    SmartHire
                </a>

            </div>


            <ul>

                <li>
                    <a href="index.html#jobs">
                        Jobs
                    </a>
                </li>

                <li>
                    <a href="index.html#companies">
                        Companies
                    </a>
                </li>

                <li>
                    <a href="index.html#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contact
                    </a>
                </li>

            </ul>


            <div class="auth-buttons">

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Sign Up
                </a>

            </div>

        </nav>

    </header>


    <!-- Registration -->

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join SmartHire and find your next opportunity.
                </p>


                <form id="register-form">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="register-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="register-name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="register-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="register-email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="register-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- User Type -->

                    <div class="form-group">

                        <label for="user-type">
                            Account Type
                        </label>

                        <select id="user-type" required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="candidate">
                                Candidate
                            </option>

                            <option value="recruiter">
                                Recruiter
                            </option>

                        </select>

                    </div>


                    <!-- Submit -->

                    <button type="submit">
                        Create Account
                    </button>


                </form>


                <p id="register-message"></p>


                <p class="auth-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <div class="footer-content">

            <h2>
                SmartHire
            </h2>

            <p>
                Connecting talent with opportunity.
            </p>

            <p>
                &copy; 2026 SmartHire. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="../js/register.js"></script>

</body>

</html>
